            "CISA types this as a string and names its two values only in the property's description, so the enum rests on that sentence and on the pinned catalogue."
          ],
          "from_schema": "https://w3id.org/lmodel/kev-catalog",
          "slot_uri": "kev_catalog:forensicTriage",
          "owner": "KevVulnerability",
          "domain_of": [
            "KevVulnerability"
          ],
          "range": "KevForensicTriage"
        },
        "notes": {
          "name": "notes",
          "annotations": {
            "upstream_path": {
              "tag": "upstream_path",
              "value": "#/$defs/vulnerability/properties/notes"
            }
          },
          "description": "Anything else CISA adds about the entry, as free text.",
          "comments": [
            "Often holds addresses separated by \" ; \", with empty places between them. The schema keeps it one string and parses nothing, since CISA states no form for it. Those addresses are third parties', under their own terms."
          ],
          "from_schema": "https://w3id.org/lmodel/kev-catalog",
          "close_mappings": [
            "skos:note"
          ],
          "slot_uri": "kev_catalog:notes",
          "owner": "KevVulnerability",
          "domain_of": [
            "KevVulnerability"
          ],
          "range": "string"
        },
        "cwes": {
          "name": "cwes",
          "annotations": {
            "upstream_path": {
              "tag": "upstream_path",
              "value": "#/$defs/vulnerability/properties/cwes"
            }
          },
          "description": "The CWE codes CISA associates with the vulnerability.",
          "notes": [
            "Close, not exact: both give an entry's CWE codes, but in the sample of 120 entries the list equalled the codes of the CVE record's CNA and ADP containers together on 94. SEPSES's hasCWE links a CVE to a CWE resource, not a code, so it is only related. Wikidata's P3624 holds the CWE number alone, without the CWE- prefix CISA writes, so it is close."
          ],
          "comments": [
            "The list may be empty, as it is on some entries of the pinned catalogue."
          ],
          "examples": [
            {
              "value": "CWE-502"
            }
          ],
          "from_schema": "https://w3id.org/lmodel/kev-catalog",
          "close_mappings": [
            "cve:cweId",
            "wdt:P3624"
          ],
          "related_mappings": [
            "sepses_cve:hasCWE"
          ],
          "slot_uri": "kev_catalog:cwes",
          "owner": "KevVulnerability",
          "domain_of": [
            "KevVulnerability"
          ],
          "range": "string",
          "multivalued": true,
          "pattern": "^CWE-([0-9])+$"
        }
      },
      "class_uri": "kev_catalog:KevVulnerability"
    }
  },
  "metamodel_version": "1.12.0",
  "source_file": "src/kev_catalog/schema/kev_catalog.yaml",
  "@type": "SchemaDefinition"
}