# linkml-lint reads this file from the directory `just lint` runs in.
# The recommended rules apply, with the naming rule fitted to KEV's own names,
# so that a real KEV file validates unchanged. The slots keep the keys CISA's
# files write, which are lowerCamelCase with one upper-case run (vendorProject,
# cveID). The permissible values keep CISA's spelling (Known, Unknown, Yes, No),
# so the naming rule leaves them out. Class and enum names keep the rule's
# usual form.
extends: recommended
rules:
  standard_naming:
    level: error
    slot_pattern: "^[a-z][A-Za-z0-9]*$"
    exclude_type:
      - permissible_value
