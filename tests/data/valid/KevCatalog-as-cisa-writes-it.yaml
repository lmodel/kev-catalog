  - cveID: CVE-2026-118527
    vendorProject: Ivanti
    product: Connect Secure
    vulnerabilityName: Ivanti Connect Secure Generation of Predictable Numbers or Identifiers
      Vulnerability
    dateAdded: '2026-10-30'
    shortDescription: Ivanti Connect Secure contains a generation of predictable numbers or
      identifiers vulnerability that allows a remote authenticated attacker to upload files
      with attacker-controlled content to a known location on disk. This vulnerability can
      be chained with CVE-2026-104935 and CVE-2026-111357.
    requiredAction: Apply mitigations in accordance with vendor instructions, ensuring compliance
      with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see URL in Notes)
      guidance and CISA’s “Forensics Triage Requirements” (see URL in Notes). Follow applicable
      BOD 26-04 guidance for cloud services or discontinue use of the product if mitigations
      are unavailable. Stakeholders are responsible for evaluating each asset's internet exposure
      and ensuring adherence to BOD 26-04 patching guidelines.
    dueDate: '2026-11-13'
    knownRansomwareCampaignUse: Unknown
    forensicTriage: 'No'
    notes: 'https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US
      ; ; BOD 26-04: https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
